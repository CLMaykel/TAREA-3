<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes</title>
    <!-- Vinculamos el archivo CSS mejorado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="formulario-container">
        <h2>Registro de Clientes</h2>

        <form id="miFormulario">
            <div class="grupo-input">
                <label for="cedula">Cédula (10 dígitos):</label>
                <input type="text" id="cedula" maxlength="10" placeholder="Ej: 1312345678">
            </div>

            <div class="grupo-input">
                <label for="nombre">Nombre (Máx. 30 caracteres):</label>
                <input type="text" id="nombre" maxlength="30" placeholder="Ej: Juan Pérez">
            </div>

            <div class="grupo-input">
                <label for="direccion">Dirección (Máx. 50 caracteres):</label>
                <input type="text" id="direccion" maxlength="50" placeholder="Ej: Av. 24 y Calle 12">
            </div>

            <div class="grupo-input">
                <label for="telefono">Teléfono Celular (10 dígitos):</label>
                <input type="text" id="telefono" maxlength="10" placeholder="Ej: 0991234567">
            </div>

            <div class="grupo-input">
                <label for="correo">Correo Electrónico:</label>
                <input type="text" id="correo" placeholder="Ej: correo@ejemplo.com">
            </div>

            <button type="submit">Guardar Cliente</button>
        </form>
    </div>

    <!-- Vinculamos el archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
